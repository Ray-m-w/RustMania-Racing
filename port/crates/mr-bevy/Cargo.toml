[package]
name = "mr-bevy"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
mr-disc = { path = "../mr-disc" }
mr-assets = { path = "../mr-assets" }
mr-trace = { path = "../mr-trace" }
mr-sim = { path = "../mr-sim" }
# The only crate that may depend on Bevy (ADR-0002 split). Feature set starts
# from the quarry's ADR-0009 Amendment 1 list (bevy_winit, bevy_sprite dropped:
# 2D only, bevy_core_pipeline, bevy_render, bevy_image, bevy_window,
# multi_threaded) plus what a textured 3D track needs (pbr, mesh, camera, light,
# asset, color, log, gizmos for the debug ghost). bevy_text/bevy_ui stay off:
# bevy_text pulls ttf-parser (RUSTSEC-2026-0192, unmaintained).
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_winit", "bevy_core_pipeline", "bevy_render", "bevy_image", "bevy_window",
    "multi_threaded", "bevy_pbr", "bevy_mesh", "bevy_camera", "bevy_light",
    "bevy_asset", "bevy_color", "bevy_log", "bevy_gizmos", "bevy_gizmos_render",
    "std", "async_executor", "bevy_state",
    # Session 4 C (owner-approved): device output only. bevy_audio -> rodio
    # 0.22 (playback) -> cpal 0.17; no decoder features (mr-audio decodes the
    # disc's XA / SPU ADPCM itself). BINLIST.toml [[artifact]] bevy_audio.
    "bevy_audio",
] }
mr-audio = { path = "../mr-audio" }
mr-video = { path = "../mr-video" }
